name: Build & Test NextBoot

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-rust:
    name: Rust Unit Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run boot-core & boot-cli tests
        run: cargo test -p boot-core -p boot-cli

      - name: Smoke test CLI in mock mode
        run: |
          cargo run -p boot-cli -- --mock status
          cargo run -p boot-cli -- --mock list
          cargo run -p boot-cli -- --mock next windows
          cargo run -p boot-cli -- --mock default windows
          cargo run -p boot-cli -- --mock clear-next

  build-desktop:
    name: Build Desktop + CLI (${{ matrix.platform }})
    needs: test-rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: ubuntu-22.04-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - name: Install frontend dependencies
        run: npm install

      - name: Build CLI binary (release)
        run: cargo build --release -p boot-cli

      - name: Build Tauri desktop application
        run: npm run tauri build

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nextboot-windows-x64
          path: |
            target/release/nextboot-cli.exe
            target/release/nextboot.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: Upload Ubuntu artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nextboot-ubuntu-x64
          path: |
            target/release/nextboot-cli
            target/release/bundle/deb/*.deb

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare flat release assets
        run: |
          mkdir -p dist-release
          find release-artifacts -type f | while IFS= read -r file; do
            base=$(basename "$file")
            if [ "$base" = "nextboot.exe" ]; then
              cp "$file" "dist-release/NextBoot-portable-windows-x64.exe"
            elif [ "$base" = "nextboot-cli" ]; then
              cp "$file" "dist-release/nextboot-cli-linux-x64"
            else
              cp "$file" "dist-release/$base"
            fi
          done
          ls -lh dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NextBoot ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## NextBoot ${{ github.ref_name }}

            跨平台 UEFI 多系统重启切换工具（Windows 10/11 & Ubuntu 22.04 / 24.04）。

            ### 下载说明
            - **Windows 桌面安装包**：下载 `*-setup.exe`（NSIS 安装包）或 `*.msi`；绿色便携版请下载 `NextBoot-portable-windows-x64.exe`
            - **Windows 命令行版**：下载 `nextboot-cli.exe`（请在管理员终端运行）
            - **Ubuntu 22.04 / 24.04**：下载 `*.deb` 并执行 `sudo apt install ./NextBoot_*.deb`（同时自动安装桌面 GUI 与 `/usr/bin/nextboot-cli`）
            - **Linux 独立命令行版**：下载 `nextboot-cli-linux-x64`（需 `chmod +x` 并配合 `sudo` 运行）
          files: dist-release/*
