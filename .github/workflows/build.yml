name: Build & Test NextBoot

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-rust:
    name: Rust Unit Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run boot-core & boot-cli tests
        run: cargo test -p boot-core -p boot-cli

      - name: Smoke test CLI in mock mode
        run: |
          cargo run -p boot-cli -- --mock status
          cargo run -p boot-cli -- --mock list
          cargo run -p boot-cli -- --mock next windows
          cargo run -p boot-cli -- --mock default windows
          cargo run -p boot-cli -- --mock clear-next

  build-desktop:
    name: Build Desktop + CLI (${{ matrix.platform }})
    needs: test-rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: ubuntu-22.04-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - name: Install frontend dependencies
        run: npm install

      - name: Build CLI binary (release)
        run: cargo build --release -p boot-cli

      - name: Build Tauri desktop application
        run: npm run tauri build

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nextboot-windows-x64
          path: |
            target/release/nextboot-cli.exe
            target/release/nextboot.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      - name: Upload Ubuntu artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nextboot-ubuntu-x64
          path: |
            target/release/nextboot-cli
            target/release/bundle/deb/*.deb

  publish-release:
    name: Publish GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare flat release assets
        run: |
          mkdir -p dist-release
          find release-artifacts -type f | while IFS= read -r file; do
            base=$(basename "$file")
            if [ "$base" = "nextboot.exe" ]; then
              cp "$file" "dist-release/NextBoot-portable-windows-x64.exe"
            elif [ "$base" = "nextboot-cli" ]; then
              cp "$file" "dist-release/nextboot-cli-linux-x64"
            else
              cp "$file" "dist-release/$base"
            fi
          done
          ls -lh dist-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NextBoot ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            <div align="center">
              <img src="https://raw.githubusercontent.com/zhengbaiyang/nextboot/main/docs/images/banner.svg" alt="NextBoot Banner" width="820" />
            </div>

            ## NextBoot ${{ github.ref_name }}

            **跨平台 UEFI 多系统重启切换工具（Windows 10/11 & 20+ 主流 Linux 发行版）** — 专为远程控制多系统电脑打造，支持桌面 GUI 与同源 CLI，在系统内直接决定下一次重启目标或设为长期默认，告别自动重启掉回其他系统导致失联。

            ### 核心特性亮点
            - **全新 Bento 精密触感桌面界面**：浅色默认 Bento 卡片 + 深邃曜石主状态卡，支持一键切换 **浅色 / 深色 Obsidian 主题**，内置实时搜索与分类筛选。
            - **20+ 主流 Linux 发行版 UEFI 识别与专属图标**：支持 Ubuntu、Debian、Fedora、Arch Linux、Manjaro、Linux Mint、Pop!_OS、openSUSE、Kali、Rocky/Alma/CentOS/Red Hat、NixOS、Gentoo、Deepin/UOS、银河麒麟、EndeavourOS、SteamOS、Proxmox VE、Alpine、Void Linux 等。
            - **应用内 GitHub Releases 自动更新**：启动时静默检测新版本，支持安全通道流式下载、实时进度条展示，以及 Windows 安装包自动拉起 / Linux `.deb` 一键更新。

            ### 界面演示与截图

            <div align="center">
              <img src="https://raw.githubusercontent.com/zhengbaiyang/nextboot/main/docs/images/ui-demo.gif" alt="NextBoot UI 交互演示" width="720" />
            </div>

            | 浅色 Bento 主界面 | 深色 Obsidian 主题 |
            | :---: | :---: |
            | ![浅色 Bento 主界面](https://raw.githubusercontent.com/zhengbaiyang/nextboot/main/docs/images/ui-main.png) | ![深色 Obsidian 主题](https://raw.githubusercontent.com/zhengbaiyang/nextboot/main/docs/images/ui-dark.png) |

            | 重启二次确认与强制重启开关 | 应用内 GitHub Releases 自动更新 |
            | :---: | :---: |
            | ![重启确认弹窗](https://raw.githubusercontent.com/zhengbaiyang/nextboot/main/docs/images/ui-modal.png) | ![应用内自动更新](https://raw.githubusercontent.com/zhengbaiyang/nextboot/main/docs/images/ui-update.png) |

            ### 下载与安装指南

            | 目标系统 | 对应文件 | 使用方式 |
            | :--- | :--- | :--- |
            | **Windows 10/11 安装包** | `*-setup.exe` / `*.msi` | 双击安装，启动时自动请求一次 UAC 管理员权限 |
            | **Windows 10/11 绿色便携版** | `NextBoot-portable-windows-x64.exe` | 免安装，双击即用 |
            | **Windows 命令行版** | `nextboot-cli.exe` | 在管理员终端运行（如 `nextboot-cli.exe next arch --reboot`） |
            | **Ubuntu / Debian 系** | `*.deb` | 执行 `sudo apt install ./NextBoot_*.deb`（同时安装桌面 GUI 与 `/usr/bin/nextboot-cli`） |
            | **Linux 独立命令行版** | `nextboot-cli-linux-x64` | `chmod +x` 后配合 `sudo` 使用，适合各发行版与 SSH 终端场景 |

            > 完整功能说明与排查文档请查看 [项目主页 README](https://github.com/zhengbaiyang/nextboot#readme)。
          files: dist-release/*
