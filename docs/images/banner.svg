<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="NextBoot Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#17253d"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="18%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card background -->
  <rect x="2" y="2" width="896" height="216" rx="18" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="216" rx="18" fill="url(#glowBlue)"/>
  <rect x="2" y="2" width="896" height="216" rx="18" fill="url(#glowOrange)"/>

  <!-- Subtle grid dots -->
  <g fill="#475569" opacity="0.25">
    <circle cx="760" cy="42" r="2"/><circle cx="790" cy="42" r="2"/><circle cx="820" cy="42" r="2"/><circle cx="850" cy="42" r="2"/>
    <circle cx="760" cy="70" r="2"/><circle cx="790" cy="70" r="2"/><circle cx="820" cy="70" r="2"/><circle cx="850" cy="70" r="2"/>
    <circle cx="760" cy="98" r="2"/><circle cx="790" cy="98" r="2"/><circle cx="820" cy="98" r="2"/><circle cx="850" cy="98" r="2"/>
  </g>

  <!-- Logo Emblem -->
  <g transform="translate(56, 52)">
    <rect width="116" height="116" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Windows Blue right arrow -->
    <rect x="24" y="32" width="44" height="14" rx="5" fill="#38bdf8"/>
    <polygon points="64,23 94,39 64,55" fill="#38bdf8"/>
    <!-- Linux Orange left arrow -->
    <rect x="48" y="70" width="44" height="14" rx="5" fill="#fb923c"/>
    <polygon points="52,61 22,77 52,93" fill="#fb923c"/>
  </g>

  <!-- Title & Tagline -->
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, system-ui, sans-serif">
    <text x="202" y="96" fill="#f8fafc" font-size="44" font-weight="750" letter-spacing="-0.5">NextBoot</text>
    <text x="204" y="132" fill="#cbd5e1" font-size="17" font-weight="400">跨平台 UEFI 多系统重启切换 · Windows &amp; 20+ Linux 发行版远控防掉线助手</text>

    <!-- Feature Pills -->
    <g transform="translate(204, 152)" font-size="12.5" font-weight="600">
      <rect x="0" y="0" width="124" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="62" y="18.5" text-anchor="middle" fill="#7dd3fc">UEFI NVRAM 原生</text>

      <rect x="136" y="0" width="106" height="28" rx="14" fill="#1e293b" stroke="#fb923c" stroke-opacity="0.5"/>
      <text x="189" y="18.5" text-anchor="middle" fill="#fdba74">GUI + 同源 CLI</text>

      <rect x="254" y="0" width="118" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="313" y="18.5" text-anchor="middle" fill="#6ee7b7">Rust + Tauri v2</text>

      <rect x="384" y="0" width="106" height="28" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="437" y="18.5" text-anchor="middle" fill="#c4b5fd">按需提权零驻留</text>
    </g>
  </g>
</svg>
