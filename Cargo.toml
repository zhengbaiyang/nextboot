[workspace]
resolver = "2"
members = [
    "crates/boot-core",
    "crates/boot-cli",
    "src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
authors = ["NextBoot Contributors"]
description = "Cross-platform UEFI multi-OS boot switcher for Windows and Ubuntu"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
